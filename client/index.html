<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social account</title>
    <style>
      :root {
        --bg: #f4f5f7;
        --surface: #ffffff;
        --border: #e2e4e9;
        --text: #1c1f26;
        --muted: #646b7a;
        --accent: #3b5bdb;
        --accent-text: #ffffff;
        --ok: #2f9e44;
        --bad: #e03131;
        --warn: #b35c00;
        --code-bg: #f0f2f5;
        --radius: 10px;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111318;
          --surface: #1a1d24;
          --border: #2a2f3a;
          --text: #e6e8ee;
          --muted: #9aa3b5;
          --accent: #6c8cff;
          --accent-text: #0e1220;
          --ok: #51cf66;
          --bad: #ff6b6b;
          --warn: #ffa94d;
          --code-bg: #12151b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 15px/1.55 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      h2 {
        margin: 0 0 0.75rem;
        font-size: 1.1rem;
        font-weight: 650;
      }
      p {
        margin: 0 0 0.75rem;
      }
      a {
        color: var(--accent);
      }
      code {
        font-family: var(--mono);
        font-size: 0.85em;
      }

      /* Top bar */
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 0.75rem 1.25rem;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 1rem;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .pill {
        padding: 0.15rem 0.6rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        font-weight: 600;
      }
      .dot {
        flex: none;
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 50%;
        background: var(--muted);
      }
      .dot-ok {
        background: var(--ok);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent);
      }
      .dot-bad {
        background: var(--bad);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 25%, transparent);
      }

      /* Layout: content column with a side panel that drops below on narrow screens */
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 42rem) 17rem;
        justify-content: center;
        align-items: start;
        gap: 1rem;
        margin: 1.5rem auto 3rem;
        padding: 0 1rem;
      }
      @media (max-width: 64rem) {
        .layout {
          grid-template-columns: minmax(0, 42rem);
        }
      }
      main {
        display: grid;
        gap: 1rem;
      }
      .panel {
        position: sticky;
        top: 1rem;
      }
      .services {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.75rem;
      }
      .services li {
        display: flex;
        gap: 0.6rem;
        align-items: flex-start;
        font-size: 0.9rem;
      }
      .services .dot {
        margin-top: 0.4rem;
      }
      .service-name {
        display: block;
        font-weight: 600;
      }
      .service-detail {
        display: block;
        color: var(--muted);
        font-size: 0.82rem;
        overflow-wrap: anywhere;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.25rem;
      }
      .card-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.75rem;
      }
      .card-head h2 {
        margin: 0;
      }

      /* Fields */
      .field {
        margin: 1rem 0;
      }
      .field-label {
        display: block;
        font-size: 0.78rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }
      .field-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .field-value {
        flex: 1;
        min-width: 0;
        padding: 0.5rem 0.65rem;
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow-wrap: anywhere;
      }
      .hint {
        margin: 0.4rem 0 0;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .hint.warn {
        color: var(--warn);
      }
      .strong {
        font-weight: 650;
        color: var(--text);
      }
      .status {
        color: var(--muted);
      }
      .error {
        color: var(--bad);
      }

      /* Controls */
      button {
        font: inherit;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-text);
        font-weight: 600;
      }
      .btn-ghost {
        padding: 0.3rem 0.7rem;
        font-size: 0.85rem;
        white-space: nowrap;
      }
      /* Provider buttons, per Google's and Apple's sign-in button guidelines */
      .btn-google,
      .btn-apple {
        display: flex;
        width: 100%;
        justify-content: center;
        align-items: center;
        gap: 0.75rem;
        height: 40px;
        padding: 0 12px;
        border-radius: 4px;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.25px;
      }
      .btn-google {
        font-family: Roboto, system-ui, sans-serif;
        background: #ffffff;
        border: 1px solid #747775;
        color: #1f1f1f;
      }
      .btn-apple {
        font-family: -apple-system, system-ui, sans-serif;
        font-weight: 600;
        background: #000000;
        border: 1px solid #000000;
        color: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        .btn-google {
          background: #131314;
          border-color: #8e918f;
          color: #e3e3e3;
        }
        .btn-apple {
          background: #ffffff;
          border-color: #ffffff;
          color: #000000;
        }
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      .actions.stack {
        flex-direction: column;
      }
      input:not([type='checkbox']):not([type='radio']),
      select {
        font: inherit;
        width: 100%;
        padding: 0.5rem 0.65rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--code-bg);
        color: var(--text);
      }
      .form {
        display: grid;
        gap: 0.75rem;
      }
      .form label {
        display: block;
      }

      /* Switch: a native checkbox drawn as a toggle */
      .switch-row {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        color: var(--muted);
        cursor: pointer;
      }
      .switch {
        appearance: none;
        width: 2.6rem;
        height: 1.5rem;
        margin: 0;
        border-radius: 999px;
        background: var(--border);
        position: relative;
        cursor: pointer;
        transition: background 0.15s;
      }
      .switch::after {
        content: '';
        position: absolute;
        top: 0.2rem;
        left: 0.2rem;
        width: 1.1rem;
        height: 1.1rem;
        border-radius: 50%;
        background: var(--surface);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        transition: transform 0.15s;
      }
      .switch:checked {
        background: var(--accent);
      }
      .switch:checked::after {
        transform: translateX(1.1rem);
      }
      .switch:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      /* Build picker: radio cards */
      .build-cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
      }
      @media (max-width: 40rem) {
        .build-cards {
          grid-template-columns: 1fr;
        }
      }
      .build-card {
        position: relative;
        display: grid;
        gap: 0.4rem;
        padding: 0.9rem 1rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--code-bg);
        cursor: pointer;
        font-size: 0.9rem;
      }
      .build-card input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .build-card:has(input:checked) {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent);
        background: var(--surface);
      }
      .build-card:has(input:focus-visible) {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .build-card:has(input:disabled) {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .build-card small {
        color: var(--muted);
        line-height: 1.4;
      }
      .build-card small.warn {
        color: var(--warn);
      }

      /* Balances */
      .balances {
        width: 100%;
        border-collapse: collapse;
      }
      .balances td {
        padding: 0.5rem 0;
        border-top: 1px solid var(--border);
      }
      .balances .num {
        text-align: right;
        font-family: var(--mono);
      }

      /* Prover log */
      .log {
        margin: 0;
        max-height: 18rem;
        overflow: auto;
        padding: 0.75rem;
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        font: 0.8rem/1.5 var(--mono);
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
