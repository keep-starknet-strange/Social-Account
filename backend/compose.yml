# Backend services. From this directory:
#   docker compose --env-file .env.local up -d --build
# --env-file lets ${RPC_URL} below reach the prover without handing it the other secrets.
# Each service's Dockerfile sits next to its code and starts it through a `service:*` script.
name: social
services:
  api:
    build: { context: ., dockerfile: src/services/api/Dockerfile }
    env_file: .env.local
    environment:
      PROVER_URL: http://prover:9900
      ROTATOR_URL: http://rotator:3001
    ports: ["3000:3000"]
    restart: unless-stopped

  rotator:
    build: { context: ., dockerfile: src/services/rotator/Dockerfile }
    env_file: .env.local
    # Loopback only: lets `bun run service:api` on this machine read its /health.
    ports: ["127.0.0.1:3001:3001"]
    restart: unless-stopped

  prover:
    build: { context: ., dockerfile: src/services/prover/Dockerfile }
    environment:
      RPC_URL: ${RPC_URL}
      CHAIN_ID: SN_SEPOLIA
      # TODO: Remove once proving succeeds
      RUST_LOG: warn,starknet_transaction_prover=debug,privacy_prove=info,stwo_cairo_adapter=info,stwo_cairo_prover=info
    # Loopback only: lets `bun run service:api` on this machine reach it; nothing outside can.
    ports: ["127.0.0.1:9900:9900"]
    # A proof needs ~18 GB. The real ceiling is the Docker Desktop memory slider (the VM every
    # container shares), not this line, which only caps the container below the VM size.
    mem_limit: 20g
    restart: unless-stopped
